[project]
name = "mojo-socket"
version = "0.1.0"
description = "Pure Mojo TCP sockets via C FFI - no Python required"
authors = ["IDEA2CODE"]
channels = ["conda-forge", "modular"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
build = "mojo build src -o lib/mojo_socket.mojopkg"
test = "mojo run tests/test_socket.mojo"

[dependencies]
max = ">=24.6,<25"
